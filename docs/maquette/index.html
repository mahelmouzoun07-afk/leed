<script>
/* ---------- état de la maquette ---------- */
const E={essai:false,montant:12000,pause:false,ton:1,autonomie:1,onglet:'cible',brancheWA:false,
  connectes:{ml:true,wa:true,ig:false,fb:false,li:false},
  decisions:[
   {id:1,t:'Lead chaud',c:'o',qui:'Mme Houngbo · Maquis Chez Tanti · WhatsApp',q:'« Oui ça m\'intéresse, c\'est combien pour un logo ? »',aide:'L\'agent propose de donner votre fourchette (40 à 60 000 FCFA) et un appel.',r:['Je m\'en occupe','Laisse l\'agent répondre'],d:'il y a 12 min'},
   {id:2,t:'Question',c:'i',qui:'Boutique Awa · WhatsApp',q:'« Faites-vous aussi les enseignes ? »',r:['Oui','Non','Écrire ma réponse'],d:'reste 3 h 40',retenir:true},
   {id:3,t:'Rendez-vous',c:'v',qui:'Hôtel du Lac · Email',q:'Jeudi 15 h vous convient ? Votre agenda est libre.',r:['Oui, confirme','Autre horaire'],d:'il y a 1 h'}]};
const F=n=>n.toLocaleString('fr-FR').replace(/ | /g,' ');
function palier(m){const prix=m<25000?250:m<50000?225:m<100000?200:175;
  const cpt=m<10000?1:m<25000?2:m<50000?3:5, vit=m<10000?5:m<25000?10:m<50000?20:40, cib=m<10000?'1':m<25000?'2':m<50000?'3':'Illimité', bonus=m<10000?5:m<25000?10:m<50000?15:20;
  return{prix,ent:Math.floor(m/prix),cpt,cptTxt:cpt===5?'Tous vos comptes':cpt+' compte'+(cpt>1?'s':''),vit,cib,bonus}}

  if(d.essai){E.essai=true;E.connectes={ml:false,wa:false,ig:false,fb:false,li:false};location.hash='comptes-connexion';return}
  if(d.rep){const dec=E.decisions.find(x=>x.id==d.rep);E.decisions=E.decisions.filter(x=>x.id!=d.rep);rendre(true);toast(dec?`Noté : « ${b.textContent.trim()} ». L'agent s'en occupe.`:'Noté.');return}
  if(d.pause){E.pause=!E.pause;rendre(true);toast(E.pause?'Envois en pause. Les conversations en cours continuent.':'L\'agent a repris.');return}
  if(d.cx){const k=d.cx;if(E.connectes[k]){E.connectes[k]=false;rendre(true);toast(RES[k][0]+' débranché.')}else if(k==='wa'){modalWA()}else{E.connectes[k]=true;rendre(true);toast(RES[k][0]+' connecté.')}return}
  if(d.ton){E.ton=+d.ton;rendre(true);return}
  if(d.auto){E.autonomie=+d.auto;rendre(true);return}
  if(d.onglet){E.onglet=d.onglet;rendre(true);return}
  if(d.main){E.main=d.main==='1';rendre(true);toast(E.main?'Vous avez la main. L\'agent n\'écrit plus dans cette conversation.':'L\'agent reprend la conversation.');return}
  if(d.mode){E.essai=!E.essai;E.connectes=E.essai?{ml:true,wa:false,ig:false,fb:false,li:false}:{ml:true,wa:true,ig:false,fb:false,li:false};rendre(true);toast(E.essai?'Mode essai gratuit activé.':'Mode forfait activé.');return}
  if(d.toast){toast(d.toast);return}
  if(b.classList.contains('tog')){b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true');return}
  if(b.classList.contains('chip')&&b.hasAttribute('aria-pressed')&&b.tagName==='BUTTON'){const grp=b.parentElement.querySelectorAll('.chip[aria-pressed]');const multi=b.parentElement.hasAttribute('data-m');
    if(!multi)grp.forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed',multi?b.getAttribute('aria-pressed')!=='true':'true')}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.dataset.paye){E.essai=false;C.innerHTML=`<div class="voile"><div class="carte g c apparait"><span class="tour" style="margin:0 auto;width:28px;height:28px"></span><h3>Validez sur votre téléphone</h3><p class="petit doux">Composez votre code secret Mobile Money.</p></div></div>`;
    setTimeout(()=>{C.innerHTML='';E.connectes={ml:false,wa:false,ig:false,fb:false,li:false};location.hash='comptes-connexion';toast('Paiement reçu. Votre forfait est actif pour 30 jours.')},1900);return}
  if(f.dataset.go)location.hash=f.dataset.go});
document.addEventListener('input',e=>{if(e.target.id==='curseur'){const m=E.montant=e.target.value*1000;document.getElementById('cur-m').textContent=F(m);document.getElementById('cur-pc').hidden=m!==25000;document.getElementById('cur-dyn').innerHTML=curDyn(m)}});
window.addEventListener('hashchange',()=>rendre(false));rendre(false);
</script>
