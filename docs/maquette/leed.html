<title>Maquette leed</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Maquette leed — les écrans sont montrés à la largeur d'un téléphone,
   posés sur une paillasse grise ; le sommaire est à gauche sur grand écran. */
:root {
  --papier: #ffffff;
  --encre: #111111;
  --doux: #6b6b6b;
  --trait: #e6e6e6;
  --chip: #f4f4f4;
  --indigo: #2a2e8c;
  --indigo-doux: #eeeffa;
  --safran: #f4a51c;
  --baobab: #1f7a50;
  --baobab-doux: #e8f3ee;
  --alerte: #b4410e;
  --alerte-doux: #fcece2;
  --paillasse: #ebebed;
  --titre: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --texte: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paillasse: #19191c; color-scheme: light; }
}
:root[data-theme="dark"] { --paillasse: #19191c; color-scheme: light; }

* { box-sizing: border-box; }
body { background: var(--paillasse); color: var(--encre); font-family: var(--texte); font-size: 15px; line-height: 1.5; }
h1,h2,h3,h4 { font-family: var(--titre); margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }

/* ── Cadre général ── */
.appli { display: grid; grid-template-columns: 1fr; min-height: 100%; }
.sommaire {
  background: var(--papier); border-bottom: 1px solid var(--trait);
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
}
.som-haut { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.som-titre { font-family: var(--titre); font-weight: 700; font-size: 17px; }
.som-titre span { color: var(--doux); font-weight: 500; font-size: 13px; font-family: var(--texte); }
.som-liste { display: none; margin-top: 14px; }
.sommaire[data-ouvert="true"] .som-liste { display: block; }
.som-groupe { font-family: var(--texte); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--doux); margin: 16px 0 6px; }
.som-lien { display: flex; gap: 8px; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; font-size: 14px; color: var(--doux); }
.som-lien:hover { background: var(--chip); color: var(--encre); }
.som-lien[aria-current="true"] { background: var(--indigo-doux); color: var(--indigo); font-weight: 600; }
.som-num { font-variant-numeric: tabular-nums; min-width: 22px; }

.scene { padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.entete { max-width: 430px; margin: 0 auto 12px; }
.entete .fil { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--doux); }
.entete h2 { font-size: 21px; font-weight: 700; margin-top: 2px; }
.entete .note { color: var(--doux); font-size: 14px; margin-top: 4px; }

/* ── L'écran lui-même : largeur d'un téléphone ── */
.tel { max-width: 430px; margin: 0 auto; background: var(--papier); border-radius: 18px; overflow: hidden; box-shadow: 0 1px 2px #0000000f, 0 8px 24px #00000012; }
.ecran { display: flex; flex-direction: column; min-height: 560px; }
.corps { padding: 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.corps.serre { gap: 10px; }
.corps.plein { padding: 0; }

/* ── Barres ── */
.barre { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--trait); }
.barre .g { display: flex; align-items: center; gap: 10px; min-width: 0; }
.barre h3 { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.retour { font-size: 18px; color: var(--doux); line-height: 1; }
.marque { display: inline-flex; align-items: center; }
.marque svg { height: 17px; width: auto; display: block; }

.onglets-bas { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--trait); background: var(--papier); }
.onglets-bas button { padding: 9px 2px 10px; font-size: 10px; color: var(--doux); display: grid; gap: 3px; justify-items: center; }
.onglets-bas button[aria-current="true"] { color: var(--indigo); font-weight: 600; }
.onglets-bas .pastille { position: relative; }
.onglets-bas .pastille b { position: absolute; top: -4px; right: -9px; background: var(--alerte); color: #fff; font-size: 9px; font-weight: 700; border-radius: 9px; padding: 0 4px; }
.ico { width: 18px; height: 18px; display: block; }

/* ── Éléments ── */
.carte { border: 1px solid var(--trait); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.carte.vif { border-color: var(--alerte); background: var(--alerte-doux); }
.carte.calme { background: var(--chip); border-color: transparent; }
.ligne { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ligne.haut { align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 10px; }
.col.serre { gap: 6px; }
.min { min-width: 0; }

.bt { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 11px 16px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.bt.action { background: var(--safran); color: var(--encre); }
.bt.sombre { background: var(--encre); color: var(--papier); }
.bt.cadre { border: 1px solid var(--trait); }
.bt.petit { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
.bt.large { width: 100%; }
.bts { display: flex; gap: 8px; flex-wrap: wrap; }

.etiq { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: var(--chip); }
.etiq.ok { background: var(--baobab-doux); color: var(--baobab); }
.etiq.feu { background: var(--alerte-doux); color: var(--alerte); }
.etiq.marque { background: var(--indigo-doux); color: var(--indigo); }
.pt { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }

.chiffres { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.chiffres > div { background: var(--chip); border-radius: 10px; padding: 9px 8px; min-width: 0; }
.chiffres b { display: block; font-family: var(--titre); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chiffres span { font-size: 11px; color: var(--doux); display: block; line-height: 1.25; }
.chiffres.deux { grid-template-columns: repeat(2, 1fr); }
.chiffres.trois { grid-template-columns: repeat(3, 1fr); }

.titrine { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--doux); }
.sourdine { color: var(--doux); font-size: 13px; }
.petit { font-size: 13px; }
.gros { font-family: var(--titre); font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
.num { font-variant-numeric: tabular-nums; }

.jauge { height: 7px; border-radius: 99px; background: var(--chip); overflow: hidden; }
.jauge i { display: block; height: 100%; background: var(--indigo); }
.jauge.or i { background: var(--safran); }
.jauge.vert i { background: var(--baobab); }

.champ { border: 1px solid var(--trait); border-radius: 10px; padding: 11px 13px; font-size: 14px; color: var(--doux); background: var(--papier); }
.champ.actif { border-color: var(--indigo); box-shadow: 0 0 0 2px var(--indigo-doux); color: var(--encre); }
.liste { display: flex; flex-direction: column; }
.liste > * { padding: 12px 0; border-top: 1px solid var(--trait); }
.liste > *:first-child { border-top: 0; }

.bulle { max-width: 84%; padding: 9px 12px; border-radius: 14px; font-size: 14px; }
.bulle.lui { background: var(--chip); border-bottom-left-radius: 3px; align-self: flex-start; }
.bulle.moi { background: var(--indigo-doux); border-bottom-right-radius: 3px; align-self: flex-end; }
.flou { filter: blur(5px); user-select: none; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--doux); padding: 0 8px 7px 0; }
td { padding: 9px 8px 9px 0; border-top: 1px solid var(--trait); vertical-align: top; }
td:last-child, th:last-child { padding-right: 0; text-align: right; }
.defile { overflow-x: auto; }

.pied { display: flex; align-items: center; justify-content: space-between; gap: 10px; max-width: 430px; margin: 14px auto 0; }
.pied button { color: var(--doux); font-size: 14px; padding: 8px 10px; border-radius: 8px; }
.pied button:hover { background: var(--papier); color: var(--encre); }
.pied button[disabled] { opacity: .35; cursor: default; }
.compteur { font-size: 13px; color: var(--doux); font-variant-numeric: tabular-nums; }

@media (min-width: 900px) {
  .appli { grid-template-columns: 272px 1fr; }
  .sommaire { border-bottom: 0; border-right: 1px solid var(--trait); height: 100dvh; overflow-y: auto; position: sticky; top: 0; }
  .som-liste { display: block; }
  .som-bascule { display: none; }
  .scene { padding-block: 28px 56px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="appli">
  <nav class="sommaire" id="sommaire" aria-label="Les écrans">
    <div class="som-haut">
      <div>
        <div class="som-titre">Maquette <span>· leed</span></div>
        <div class="sourdine" style="font-size:12px"><span id="total"></span> écrans · données d'exemple</div>
      </div>
      <button class="bt cadre petit som-bascule" id="bascule" aria-expanded="false">Les écrans</button>
    </div>
    <div class="som-liste" id="som-liste"></div>
  </nav>

  <main class="scene">
    <div class="entete">
      <div class="fil" id="fil"></div>
      <h2 id="titre"></h2>
      <p class="note" id="note"></p>
    </div>
    <div class="tel"><div class="ecran" id="ecran"></div></div>
    <div class="pied">
      <button id="prec">← Précédent</button>
      <span class="compteur" id="compteur"></span>
      <button id="suiv">Suivant →</button>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";
  const e = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ── Briques ── */
  // Le logo leed : lettres construites en formes, le « d » final en disque plein.
  const marque = () =>
    `<span class="marque"><svg viewBox="0 36 496 180" role="img" aria-label="leed">
      <rect x="0" y="36" width="32" height="180" fill="currentColor"/>
      <path d="M176 146A54 54 0 1 0 164.55 179.25" fill="none" stroke="currentColor" stroke-width="32"/>
      <path d="M68 146H192" fill="none" stroke="currentColor" stroke-width="26"/>
      <path d="M328 146A54 54 0 1 0 316.55 179.25" fill="none" stroke="currentColor" stroke-width="32"/>
      <path d="M220 146H344" fill="none" stroke="currentColor" stroke-width="26"/>
      <circle cx="426" cy="146" r="70" fill="var(--indigo)"/>
      <rect x="464" y="36" width="32" height="180" fill="currentColor"/>
    </svg></span>`;
  const barre = (titre, droite = "", retour = false) =>
    `<div class="barre"><div class="g">${retour ? '<span class="retour">←</span>' : ""}${titre}</div><div class="g">${droite}</div></div>`;
  const barreMarque = (droite = "") => barre(marque(), droite);
  const bt = (t, k = "cadre", c = "") => `<span class="bt ${k} ${c}">${t}</span>`;
  const etiq = (t, k = "") => `<span class="etiq ${k}">${t}</span>`;
  const jauge = (pct, k = "") => `<div class="jauge ${k}"><i style="width:${pct}%"></i></div>`;
  const chiffres = (l, k = "") =>
    `<div class="chiffres ${k}">${l.map(([v, s]) => `<div><b>${v}</b><span>${s}</span></div>`).join("")}</div>`;
  const carte = (c, k = "") => `<div class="carte ${k}">${c}</div>`;
  const titrine = (t) => `<div class="titrine">${t}</div>`;
  const champ = (t, actif = false) => `<div class="champ ${actif ? "actif" : ""}">${t}</div>`;
  const tableau = (entetes, lignes) =>
    `<div class="defile"><table><thead><tr>${entetes.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${lignes
      .map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`)
      .join("")}</tbody></table></div>`;

  const ICO = {
    maison: "M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",
    coche: "M9 12.5l2.2 2.2L15.8 9M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z",
    bulle: "M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z",
    barres: "M5 20V10M12 20V4M19 20v-7",
    menu: "M4 7h16M4 12h16M4 17h16",
  };
  const ico = (d) => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICO[d]}"/></svg>`;
  const barreBas = (actif) => {
    const o = [
      ["accueil", "Accueil", "maison", 0],
      ["decisions", "Décisions", "coche", 3],
      ["conversations", "Messages", "bulle", 0],
      ["rapports", "Rapports", "barres", 0],
      ["plus", "Plus", "menu", 0],
    ];
    return `<div class="onglets-bas">${o
      .map(
        ([id, l, i, n]) =>
          `<button ${actif === id ? 'aria-current="true"' : ""}><span class="${n ? "pastille" : ""}">${ico(i)}${n ? `<b>${n}</b>` : ""}</span>${l}</button>`,
      )
      .join("")}</div>`;
  };

  /* ══════════ LES ÉCRANS ══════════ */
  const E = [];
  const ecran = (id, groupe, titre, note, html) => E.push({ id, groupe, titre, note, html });

  /* ───── Site public ───── */
  ecran("accueil", "Site public", "Page d'accueil", "Le visiteur colle l'adresse de son site, ou décrit son activité.",
    barreMarque(bt("Connexion", "cadre", "petit")) +
    `<div class="corps">
      ${etiq("Essai gratuit · 10 entreprises contactées")}
      <h1 style="font-family:var(--titre);font-size:30px;font-weight:700;line-height:1.08;letter-spacing:-0.035em">Trouvez vos clients<br><span style="color:var(--indigo)">pendant que vous dormez</span></h1>
      <p class="sourdine">leed étudie votre marché, écrit à vos futurs clients depuis vos propres comptes et vous amène des rendez-vous.</p>
      ${champ("L'adresse de votre site, ex. studiokoffi.bj", true)}
      ${bt("Trouver mes clients", "action", "large")}
      <p class="petit" style="text-align:center;color:var(--doux)">Pas de site ? <u>Décrivez votre activité</u></p>
      <div class="carte calme">
        ${titrine("Depuis vos propres comptes")}
        <div class="ligne"><span class="petit">WhatsApp · Instagram · Facebook</span>${etiq("Vos comptes", "marque")}</div>
        <p class="sourdine">C'est vous qui écrivez, pas un numéro inconnu.</p>
      </div>
      <p class="petit" style="text-align:center;color:var(--doux)">Paiement en Mobile Money dès 5 000 FCFA</p>
    </div>`)

  ecran("tarifs", "Site public", "Tarifs", "Le curseur part sur 25 000 FCFA, le palier le plus choisi.",
    barreMarque(bt("Connexion", "cadre", "petit")) +
    `<div class="corps">
      <h3 style="font-size:22px;font-weight:700">Payez ce que vous voulez</h3>
      <p class="sourdine">Pas d'abonnement. Un forfait valable 30 jours, dès 5 000 FCFA.</p>
      ${carte(`
        <div class="ligne"><span class="gros">25 000 FCFA</span>${etiq("Le plus choisi", "marque")}</div>
        ${jauge(50)}
        ${chiffres([["111", "Entreprises contactées"], ["225 F", "Par entreprise"], ["3", "Comptes connectés"], ["20/j", "Rythme"]], "deux")}
        ${bt("Essayer gratuitement", "action", "large")}
        <p class="petit" style="text-align:center;color:var(--doux)">Ajoutez 25 000 FCFA : 200 F l'entreprise et tous vos comptes</p>`)}
      ${carte(`${titrine("Compris dans chaque entreprise contactée")}
        <div class="col serre petit">
          <div>✓ La recherche de l'entreprise et de ses coordonnées</div>
          <div>✓ Son étude et le choix du canal</div>
          <div>✓ Un premier message personnel et 2 relances</div>
          <div>✓ Toutes les réponses de l'agent et la prise de rendez-vous</div>
        </div>`, "calme")}
    </div>`)

  ecran("apropos", "Site public", "À propos", "Qui fait leed, et pourquoi. Aucun chiffre tant qu'il n'est pas vrai.",
    barreMarque(bt("Connexion", "cadre", "petit")) +
    `<div class="corps">
      <h3 style="font-size:22px;font-weight:700">Fait à Cotonou, pour l'Afrique de l'Ouest</h3>
      <p class="sourdine">Les outils de prospection existants sont en anglais, en dollars, par carte bancaire, et par email seulement. Ici, l'email professionnel est rare. On discute sur WhatsApp.</p>
      ${carte(`${titrine("Ce qu'on fait autrement")}
        <div class="liste petit">
          <div><b>On écrit depuis vos comptes.</b><div class="sourdine">Le prospect voit votre nom, votre photo, votre numéro.</div></div>
          <div><b>On paie en Mobile Money.</b><div class="sourdine">MTN, Moov, Wave, Celtiis, Orange. Pas de carte.</div></div>
          <div><b>On connaît les entreprises d'ici.</b><div class="sourdine">Même celles qui n'ont ni site ni email.</div></div>
        </div>`)}
      ${carte(`${titrine("Nous écrire")}<div class="petit">bonjour@leed.app · WhatsApp +229 ·· ·· ·· ··</div>`, "calme")}
    </div>`)

  ecran("support", "Site public", "Support", "Les questions fréquentes, puis la discussion.",
    barreMarque(bt("Connexion", "cadre", "petit")) +
    `<div class="corps">
      <h3 style="font-size:20px;font-weight:700">Comment peut-on vous aider ?</h3>
      ${champ("Chercher une question…")}
      <div class="liste petit">
        <div class="ligne"><span>Est-ce que mon compte WhatsApp risque quelque chose ?</span><span class="sourdine">+</span></div>
        <div class="ligne"><span>Comment je paie sans carte bancaire ?</span><span class="sourdine">+</span></div>
        <div class="ligne"><span>Que se passe-t-il à la fin de mon forfait ?</span><span class="sourdine">+</span></div>
        <div class="ligne"><span>Qui voit mes conversations ?</span><span class="sourdine">+</span></div>
        <div class="ligne"><span>Est-ce que c'est du spam ?</span><span class="sourdine">+</span></div>
      </div>
      ${carte(`<div class="ligne"><div class="min"><b class="petit">Pas trouvé ?</b><div class="sourdine">On répond en quelques minutes.</div></div>${bt("Nous écrire", "sombre", "petit")}</div>`, "calme")}
    </div>`)

  /* ───── Parcours ───── */
  ecran("entree", "Parcours", "Décrire son activité", "Deux portes d'entrée : le site, ou le formulaire.",
    barreMarque() +
    `<div class="corps">
      ${titrine("Étape 1 sur 6")}
      <h3 style="font-size:20px;font-weight:700">Parlez-nous de votre activité</h3>
      ${carte(`<div class="ligne"><b class="petit">J'ai un site web</b>${etiq("Le plus rapide", "marque")}</div>
        ${champ("studiokoffi.bj", true)}
        ${bt("Analyser mon site", "action", "large")}`)}
      ${carte(`<b class="petit">Je n'ai pas de site</b>
        <p class="sourdine">Décrivez ce que vous vendez en quelques lignes et cochez des cases.</p>
        ${bt("Remplir le formulaire", "cadre", "large")}`, "calme")}
    </div>`)

  ecran("formulaire", "Parcours", "Le formulaire", "Pour ceux qui n'ont pas de site. Sept questions, des cases à cocher.",
    barre(`<span class="retour">←</span><h3>Votre activité</h3>`) +
    `<div class="corps serre">
      <div class="col serre"><span class="titrine">Ce que vous vendez</span>${champ("Logos, affiches, identités visuelles", true)}</div>
      <div class="col serre"><span class="titrine">Votre client idéal</span>${champ("Commerces de Cotonou qui veulent soigner leur image")}</div>
      <div class="col serre"><span class="titrine">Secteurs visés</span>
        <div class="bts">${etiq("Restaurants ✓", "marque")}${etiq("Boutiques ✓", "marque")}${etiq("Écoles ✓", "marque")}${etiq("Hôtels")}${etiq("+ ajouter")}</div></div>
      <div class="col serre"><span class="titrine">Taille des entreprises</span>

  /* ══════════ Navigation ══════════ */
  const liste = document.getElementById("som-liste");
  let html = "";
  let groupe = "";
  E.forEach((s, i) => {
    if (s.groupe !== groupe) {
      groupe = s.groupe;
      html += `<div class="som-groupe">${e(groupe)}</div>`;
    }
    html += `<button class="som-lien" data-i="${i}"><span class="som-num">${String(i + 1).padStart(2, "0")}</span><span>${e(s.titre)}</span></button>`;
  });
  liste.innerHTML = html;

  const vue = { i: 0 };
  const $ = (id) => document.getElementById(id);
  $("total").textContent = String(E.length);

  function montrer(i, parHash) {
    vue.i = Math.max(0, Math.min(E.length - 1, i));
    const s = E[vue.i];
    $("fil").textContent = s.groupe;
    $("titre").textContent = s.titre;
    $("note").textContent = s.note;
    $("ecran").innerHTML = s.html;
    $("compteur").textContent = `${vue.i + 1} / ${E.length}`;
    $("prec").disabled = vue.i === 0;
    $("suiv").disabled = vue.i === E.length - 1;
    liste.querySelectorAll(".som-lien").forEach((b) =>
      b.setAttribute("aria-current", String(Number(b.dataset.i) === vue.i)),
    );
    if (!parHash) {
      try { history.replaceState(null, "", "#" + s.id); } catch (_) {}
    }
    const actif = liste.querySelector('[aria-current="true"]');
    if (actif && window.innerWidth >= 900) actif.scrollIntoView({ block: "nearest" });
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  liste.addEventListener("click", (ev) => {
    const b = ev.target.closest(".som-lien");
    if (!b) return;
    montrer(Number(b.dataset.i));
    if (window.innerWidth < 900) $("sommaire").dataset.ouvert = "false";
    $("bascule").setAttribute("aria-expanded", "false");
  });
  $("prec").addEventListener("click", () => montrer(vue.i - 1));
  $("suiv").addEventListener("click", () => montrer(vue.i + 1));
  $("bascule").addEventListener("click", () => {
    const s = $("sommaire");
    const o = s.dataset.ouvert !== "true";
    s.dataset.ouvert = String(o);
    $("bascule").setAttribute("aria-expanded", String(o));
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
    if (ev.key === "ArrowRight") montrer(vue.i + 1);
    if (ev.key === "ArrowLeft") montrer(vue.i - 1);
  });
  window.addEventListener("hashchange", () => {
    const i = E.findIndex((s) => s.id === location.hash.slice(1));
    if (i >= 0 && i !== vue.i) montrer(i, true);
  });

  const depart = E.findIndex((s) => s.id === location.hash.slice(1));
  montrer(depart >= 0 ? depart : 0, true);
})();
